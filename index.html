  <!-- ═══════ Dev-mode: kill stale Service Worker BEFORE PWA plugin registers ═══════ -->
  <script>
    (function(){if(!('serviceWorker'in navigator))return;if(location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')return;navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});if('caches'in window){caches.keys().then(function(n){n.forEach(function(k){if(k.includes('workbox')||k.includes('vite'))caches.delete(k)})})}})();
  </script>
