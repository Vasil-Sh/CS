name: CI — Lint, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend lives in its own repo (Vasil-Sh/cs-backend) with its own CI; here it is only a submodule
  # pointer that this checkout does not fetch — the old «Backend» job could never find its folder.

  # ── Frontend ──
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json «packageManager» (giving it here too failed the step)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # E2E (Playwright) is not run here: @playwright/test is not among the dependencies, so the job could never start.
  # Add it (pnpm add -D @playwright/test) and bring the job back once the e2e specs match the current screens.
